# docker-compose.yml — runs the Remotion editor stack locally.
#
# Two services:
#   - server: Express + @remotion/bundler + @remotion/renderer  (port 3001)
#   - client: nginx serving the prebuilt Vite SPA               (port 5173)
#
# The `compositions/` source tree is NOT a separate service. It is bundled
# by the server exactly as it would be on a single host: the renderer's
# `bundle({ entryPoint })` reads the source from disk at runtime, either
# from the bind-mount in dev or from the COPY in the production image.
#
# Quick start:
#   npm install                  # per-package, see README.md
#   docker compose up --build    # builds both images and starts them
#   open http://localhost:5173/

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: remotion-editor-server:local
    container_name: remotion-server
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_HOST: http://localhost:3001
      COMPOSITIONS_ENTRY: /app/compositions/src/index.ts
    volumes:
      # Persist uploaded media and rendered MP4s between container restarts.
      - server_uploads:/app/server/uploads
      - server_renders:/app/server/renders
    ports:
      - "3001:3001"
    # Healthcheck is the lightweight Express `GET /api/health` route that
    # already exists at server/src/index.ts (returns {ok:true,...}). We
    # `--no-fail` so a single bad response doesn't kill the container.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      # The SPA defaults to same-origin API calls (nginx proxies /api,
      # /uploads and /renders to `server`). To bake an absolute API origin
      # into the bundle instead, pass it here as a build arg:
      #   args: { VITE_API_BASE: "https://editor.example.com" }
    image: remotion-editor-client:local
    container_name: remotion-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  server_uploads:
  server_renders:
