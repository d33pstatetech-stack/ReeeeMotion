# GitHub Actions: run `npm run verify` on every push + PR to main.
#
# verify.mjs fans out 3 parallel tasks — client typecheck, client vitest,
# server typecheck — and exits non-zero on any failure. Single job keeps
# the failure surface to one log; PARALLEL=true means a fast feedback
# loop on cold caches (~5min) and faster on warm caches (~1min).
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new push hits the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name MUST stay "verify" -- it's a required branch-protection
  # status check context on main. Renaming would break the merge gate.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each per-package node_modules is cached separately because the repo
    # is intentionally NOT a workspace (each package is its own scope).
    steps:
      # All `uses:` refs pinned to commit SHAs to defeat tag retargeting
      # (a malicious maintainer who moves a @vN tag can otherwise inject
      # code into every CI run). See CONTRIBUTING.md "GitHub Actions SHA
      # pinning" for the rationale + how to update.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # pin: v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # pin: v4.4.0
        with:
          node-version: '20'

      # Cache layered per-package so a cached client doesn't bust server's.
      # Keys hash the COMMITTED LOCKFILES (they exist per package now), so
      # any dependency bump busts the cache exactly when it should.
      - name: Cache client/node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # pin: v4.3.0
        with:
          path: client/node_modules
          key: client-npm-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            client-npm-${{ runner.os }}-

      - name: Cache server/node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # pin: v4.3.0
        with:
          path: server/node_modules
          key: server-npm-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            server-npm-${{ runner.os }}-

      # NOTE: compositions/node_modules is intentionally NOT installed or
      # cached — verify.mjs typechecks compositions transitively through the
      # client's path alias, and the server bundles compositions source at
      # render time. A standalone install here would only slow CI down.
      # CI=true also makes the server's postinstall skip the headless-
      # Chromium download (not needed for typecheck+vitest).

      - name: Install client deps
        run: npm ci --no-audit --no-fund
        working-directory: client

      - name: Install server deps
        run: npm ci --no-audit --no-fund
        working-directory: server

      - name: Run verify (parallel typecheck + vitest across packages)
        run: node verify.mjs
        env:
          # vitest + tsc surface ANSI in CI without this; not strictly needed
          NO_COLOR: '0'
