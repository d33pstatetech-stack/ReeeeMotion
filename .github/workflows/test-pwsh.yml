# GitHub Actions: smoke-test the PowerShell launchers
#
# Covers scripts/_pid-manifest.ps1, scripts/cleanup-ports.ps1,
# scripts/dev.ps1, and the harness scripts/test-pwsh.ps1 itself.
# Pairs with the existing verify.yml (which covers client + server
# typecheck + vitest). Runs on every push + PR to main.
#
# PowerShell 7.x on linux is the most production-representative
# target -- pwsh is also what macOS + WSL end users install.
#
# Exit 0 = 40+ smoke asserts pass; nonzero = N failures.

name: test-pwsh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new push hits the same branch.
# (Matches verify.yml so the two workflows cancel consistently.)
concurrency:
  group: test-pwsh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pwsh:
    name: PowerShell launchers smoke (zero-dep)
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      # `uses:` SHA-pin convention: see verify.yml header.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # pin: v4.3.1

      # Install PowerShell 7.4 on the linux runner via Microsoft's apt
      # repo. Decision: deliberately DON'T use the `microsoft/powershell@v1`
      # Action here -- the upstream repo's @v1 ref behaves as a moving
      # major-version branch that the GitHub Actions marketplace resolver
      # intermittently fails to look up (manifests as
      # `repository not found` at workflow-prep time, before scripts
      # ever run). Replicating `apt-get install powershell` here removes
      # that marketplace dependency entirely.
      #
      # Runner + codename are pinned to ubuntu-22.04 so the codename in
      # packages.microsoft.com/config/ubuntu/<codename>/ stays valid
      # when GitHub rotates `ubuntu-latest` (Q4 2026 = 24.04 expected);
      # if you bump, update both lines in lockstep.
      - name: Install PowerShell 7.4 (apt; sidesteps microsoft/powershell@v1 marketplace ref)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell
          pwsh -Version

      # Run the zero-dep PS smoke harness. Exit 0 = all pass.
      # pwsh is now on PATH because the install step above put it there.
      - name: Run scripts/test-pwsh.ps1
        shell: pwsh
        run: ./scripts/test-pwsh.ps1
