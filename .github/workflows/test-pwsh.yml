# GitHub Actions: smoke-test the PowerShell launchers
#
# Covers scripts/_pid-manifest.ps1, scripts/cleanup-ports.ps1,
# scripts/dev.ps1, and the harness scripts/test-pwsh.ps1 itself.
# Pairs with the existing verify.yml (which covers client + server
# typecheck + vitest). Runs on every push + PR to main.
#
# PowerShell 7.x on linux is the most production-representative
# target -- pwsh is also what macOS + WSL end users install.
#
# Exit 0 = 40+ smoke asserts pass; nonzero = N failures.

name: test-pwsh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new push hits the same branch.
# (Matches verify.yml so the two workflows cancel consistently.)
concurrency:
  group: test-pwsh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name MUST stay "test-pwsh" -- it's a required branch-protection
  # status check context on main. Renaming would break the merge gate.
  test-pwsh:
    name: test-pwsh
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      # `uses:` SHA-pin convention: see verify.yml header.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # pin: v4.3.1

      # Install PowerShell 7.4.6 on the linux runner via the official
      # PowerShell release tarball. Decision tree:
      #   * Don't use `microsoft/powershell@v1` Action -- the upstream
      #     repo's v1 ref acts as a moving major-version branch that the
      #     GitHub Actions marketplace resolver intermittently fails to
      #     look up (manifests as `repository not found` at workflow-prep
      #     time, before scripts ever run).
      #   * Don't use `apt-get install powershell` (Microsoft's apt
      #     repo) -- the packages-microsoft-prod.deb + transitive
      #     dependency resolution is flaky on GitHub runners and
      #     repeatedly fails in CI even when the install looks correct
      #     in isolation.
      #   * The tarball route is deterministic: the URL is content
      #     addressed by its tag (v7.4.6) under github.com/PowerShell/
      #     PowerShell/releases, the version is pinned, and no third-
      #     party apt repo is involved. The 71.6 MB tarball will be
      #     served once and can be cached via GitHub Actions
      #     `actions/cache` if install time grows.
      #
      # Tarball structure confirmed: files extract directly into the
      # target dir (no top-level wrapper) -- verified empirically with
      # `tar -tzf` on the v7.4.6 tag. So the symlink target is
      # `/opt/powershell-7.4.6/pwsh`. Bump-the-version = bump both the
      # dir name AND the symlink source in lockstep.
      - name: Install PowerShell 7.4.6 (tarball; deterministic; sidesteps apt + Action marketplace)
        run: |
          set -e
          curl -fsSL -o /tmp/pwsh7.tgz https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz
          sudo mkdir -p /opt/powershell-7.4.6
          sudo tar -xzf /tmp/pwsh7.tgz -C /opt/powershell-7.4.6
          sudo chmod +x /opt/powershell-7.4.6/pwsh
          sudo ln -sf /opt/powershell-7.4.6/pwsh /usr/local/bin/pwsh
          pwsh -Version

      # Run the zero-dep PS smoke harness. Exit 0 = all pass.
      # pwsh is now on PATH because the install step above put it there.
      - name: Run scripts/test-pwsh.ps1
        shell: pwsh
        run: ./scripts/test-pwsh.ps1
