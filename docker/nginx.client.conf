# nginx config for the Remotion editor client SPA.
# - Proxies /api/* to the server service in docker-compose so the SPA can
#   call `/api/upload`, `/api/render`, etc. without exposing :3001 externally.
# - Falls back to index.html for any unknown route so client-side routing works.

server {
    listen 5173 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Images and fonts are content-hashed by Vite; cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API requests go to the server service on the docker network.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;          # 500 MB upload cap matches client logic
        proxy_read_timeout 600s;           # MP4 render can take minutes
        proxy_send_timeout 600s;
    }

    # Everything else falls back to index.html (SPA routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
